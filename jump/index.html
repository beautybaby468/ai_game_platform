<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跳一跳</title>
<link rel="stylesheet" href="style.css?v=3">
<link rel="stylesheet" href="../home-btn.css?v=3">
</head>
<body>
<div class="app">
  <div class="card">
  <a class="back-home" href="../index.html?v=3">🏠 返回大厅</a>
    <div class="topbar">
      <div class="title">🦘 跳一跳</div>
      <div class="scores">
        <span>得分 <b id="score">0</b></span>
        <span class="gold">最高 <b id="best">0</b></span>
      </div>
    </div>
    <div class="canvas-wrap">
      <canvas id="board" width="540" height="360"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">准备开始</h2>
        <p id="ovText">按住 鼠标/空格 蓄力，松开起跳<br>落在方块上得分，落在中心 +2，掉下去结束</p>
        <button id="startBtn">开始游戏</button>
      </div>
    </div>
    <div class="hint">按住蓄力 · 松手起跳 · 支持手机触摸 · 连续落中心有连击加成</div>
  </div>
</div>
<script src="game.js?v=3"></script>
</body>
</html>
