<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇 · 双模式</title>
<link rel="stylesheet" href="style.css?v=3">
<link rel="stylesheet" href="../home-btn.css?v=3">
</head>
<body>
<div class="app">
  <!-- 主页 -->
  <div class="card" id="home">
    <a class="back-home" href="../index.html?v=3">🏠 返回大厅</a>
    <h1>贪 吃 蛇</h1>
    <div class="sub">6 张地图 × 10 关 · 小蛇可穿墙穿行</div>

    <div class="modes">
      <div class="mode" id="modeLevel">
        <div class="ico">🗺️</div>
        <div class="nm">闯关模式</div>
        <div class="ds">60 关 · 逐图解锁 · 星级评价</div>
      </div>
      <div class="mode" id="modeEndless">
        <div class="ico">♾️</div>
        <div class="nm">无限模式</div>
        <div class="ds">无时间限制 · 每 100 分切换地图</div>
      </div>
    </div>

    <div class="legend">
      <span><i style="background:#e94560"></i>苹果 +5</span>
      <span><i style="background:#3dc46f"></i>西瓜 +6</span>
      <span><i style="background:#ff6b8a"></i>草莓 +8</span>
      <span><i style="background:#ffd166"></i>金苹果 +15</span>
    </div>

    <div id="mapList"></div>
    <div class="foot">
      <span id="endlessBest">无限模式最高分：0</span>
      <button class="btn-sec" id="resetProgress">重置进度</button>
    </div>
  </div>

  <!-- 游戏页 -->
  <div class="card hidden" id="game">
    <a class="back-home" href="../index.html?v=3">🏠 返回大厅</a>
    <div class="topbar">
      <div class="lvtitle" id="lvTitle"></div>
      <div class="stats">
        <span>得分 <b id="score">0</b></span>
        <span id="targetBox">目标 <b id="target">0</b></span>
        <span id="timeBox" class="hidden">时间 <b id="time">60</b></span>
      </div>
    </div>
    <div class="mapinfo hidden" id="mapInfo"></div>
    <div class="canvas-wrap">
      <canvas id="board" width="400" height="400"></canvas>
      <div class="toast" id="toast"></div>
      <div class="overlay hidden" id="overlay">
        <h2 id="ovTitle"></h2>
        <p id="ovText"></p>
        <div class="pin" id="ovBtns"></div>
      </div>
    </div>
    <div class="dpad">
      <div class="empty"></div><button data-dir="up">▲</button><div class="empty"></div>
      <button data-dir="left">◀</button><div class="empty"></div><button data-dir="right">▶</button>
      <div class="empty"></div><button data-dir="down">▼</button><div class="empty"></div>
    </div>
    <div class="hint">
      <button class="btn-sec" id="pauseBtn" style="padding:6px 16px;font-size:13px;">暂停</button>
      <button class="btn-sec" id="quitBtn" style="padding:6px 16px;font-size:13px;">返回主页</button>
      &nbsp; 空格/P 暂停 · 方向键/WASD 控制 · 时间奖励=剩余秒×1
    </div>
  </div>
</div>
<script src="game.js?v=3"></script>
</body>
</html>
