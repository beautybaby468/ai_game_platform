<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>俄罗斯方块</title>
<link rel="stylesheet" href="style.css?v=3">
<link rel="stylesheet" href="../home-btn.css?v=3">
</head>
<body>
<div class="app">
  <div class="card">
  <a class="back-home" href="../index.html?v=3">🏠 返回大厅</a>
    <h1>俄 罗 斯 方 块</h1>
    <div class="sub">经典消除 · 明亮派对</div>

    <div class="layout">
      <!-- 左侧信息栏 -->
      <div class="side">
        <div class="panel">
          <div class="label">分数</div>
          <div class="val" id="score">0</div>
        </div>
        <div class="panel">
          <div class="label">最高分</div>
          <div class="val gold" id="high">0</div>
        </div>
        <div class="panel row2">
          <div>
            <div class="label">行数</div>
            <div class="val sm" id="lines">0</div>
          </div>
          <div>
            <div class="label">等级</div>
            <div class="val sm" id="level">1</div>
          </div>
        </div>
        <div class="panel">
          <div class="label">下一个</div>
          <canvas id="next" width="96" height="96"></canvas>
        </div>
        <div class="panel">
          <div class="label">暂存 (C)</div>
          <canvas id="hold" width="96" height="96"></canvas>
        </div>
      </div>

      <!-- 游戏区 -->
      <div class="stage">
        <div class="canvas-wrap">
          <canvas id="board" width="300" height="600"></canvas>
          <div class="toast" id="toast"></div>
          <div class="overlay" id="overlay">
            <h2 id="ovTitle">准备开始</h2>
            <p id="ovText">方向键移动 · Q 旋转<br>空格硬降 · C 暂存 · P 暂停</p>
            <button id="startBtn">开始游戏</button>
          </div>
        </div>
        <div class="hint">
          <button class="btn-sec" id="pauseBtn">暂停</button>
          <button class="btn-sec" id="restartBtn">重新开始</button>
        </div>
        <!-- 手机按键 -->
        <div class="touch-row">
          <button class="tb" data-act="left">◀</button>
          <button class="tb" data-act="rotate">⟳</button>
          <button class="tb" data-act="right">▶</button>
        </div>
        <div class="touch-row">
          <button class="tb" data-act="down">▼</button>
          <button class="tb wide" data-act="drop">硬降 ⤓</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="game.js?v=3"></script>
</body>
</html>
