<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy 小鸟</title>
<link rel="stylesheet" href="style.css?v=2">
<link rel="stylesheet" href="../home-btn.css?v=2">
</head>
<body>
<div class="app">
  <div class="card">
    <div class="topbar">
      <div class="title">🐤 Flappy 小鸟</div>
      <div class="scores">
        <span>得分 <b id="score">0</b></span>
        <span class="gold">最高 <b id="best">0</b></span>
      </div>
    </div>
    <div class="canvas-wrap">
      <canvas id="board" width="400" height="560"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">准备开始</h2>
        <p id="ovText">点击 / 空格 扇动翅膀<br>穿过管道缝隙，别撞上</p>
        <button id="startBtn">开始游戏</button>
      </div>
    </div>
    <div class="hint">点击 / 空格 = 扇翅膀 · 支持手机触摸</div>
  </div>
</div>
<script src="game.js?v=2"></script>
<a class="back-home" href="../index.html">🏠 返回大厅</a>
</body>
</html>
